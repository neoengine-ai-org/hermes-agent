[agents.hermes_worker]
description = "Canonical execution role for conductor-assigned Hermes implementation or source-convergence WorkNodes. Select with agent_type=hermes_worker and an explicit admitted implementation model after runtime-parity checks; never use for review."
config_file = "agents/hermes-worker.toml"
