name: CI Runtime OS advisory

on:
  pull_request_target:
    # Only PRs into the protected default branch: base.sha is the trusted
    # code this workflow checks out and runs, so it must be protected history.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: runtime-os-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  RUNTIME_OS_POLICY_VERSION: "2.1.0"
  RUNTIME_OS_SOURCE_COMMIT: 871e416afc55db187d2b6f29c9ff7cac96472223

jobs:
  preflight:
    name: Dependency-free policy preflight
    # pull_request_review cannot be branch-filtered, so PR events also require
    # a same-repository head and the protected default branch as base.
    if: >-
      !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, x64, neoengine-shared-linux, qwen-ops]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      risk_class: ${{ steps.plan.outputs.risk_class }}
      review_route: ${{ steps.plan.outputs.review_route }}
      review_classification: ${{ steps.plan.outputs.review_classification }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      candidate_definition_changed: ${{ steps.plan.outputs.candidate_definition_changed }}
      telemetry_write_allowed: ${{ steps.plan.outputs.telemetry_write_allowed }}
      environment_digest: ${{ steps.environment.outputs.environment_digest }}
      duration_cache_key: ${{ steps.environment.outputs.duration_cache_key }}
    steps:
      - name: Reject untrusted fork execution
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1

      - name: Discard residue from earlier jobs on this shared runner
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Checkout trusted base policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .runtime-os-trusted

      # Under pull_request_target this workflow runs base code only: PR-head
      # code is never checked out or executed here. The head is read as inert
      # objects for change selection; PR-head execution lives in the
      # unprivileged ci-runtime-os-candidate.yml (`pull_request` context).
      - name: Checkout trusted non-PR candidate
        if: ${{ !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          path: candidate

      - name: Fetch pull request head as inert git objects
        if: contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C .runtime-os-trusted fetch --no-tags --no-recurse-submodules origin "$HEAD_SHA"
          git -C .runtime-os-trusted cat-file -e "${HEAD_SHA}^{commit}"

      - name: Compute immutable environment and duration identities
        id: environment
        if: ${{ !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) }}
        run: |
          set -euo pipefail
          dependency_digest="$(sha256sum candidate/uv.lock | cut -d' ' -f1)"
          test_manifest_digest="$(
            find candidate/tests -type f -name 'test_*.py' -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              cut -d' ' -f1
          )"
          environment_digest="$(printf '%s\n%s\n%s\n' \
            "$RUNTIME_OS_SOURCE_COMMIT" "$dependency_digest" "$test_manifest_digest" |
            sha256sum |
            cut -d' ' -f1)"
          echo "environment_digest=$environment_digest" >> "$GITHUB_OUTPUT"
          echo "duration_cache_key=runtime-os-duration-${test_manifest_digest}-${dependency_digest}" >> "$GITHUB_OUTPUT"

      - name: Read protected-main duration telemetry
        if: ${{ !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: ${{ steps.environment.outputs.duration_cache_key }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.environment.outputs.duration_cache_key }}-

      - name: Verify immutable policy and select proof
        id: plan
        env:
          EVENT_NAME: ${{ contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) && 'pull_request' || github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions || 0 }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'unknown' }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          RUNTIME_OS_DURATIONS_PATH: ${{ github.workspace }}/test_durations.json
        run: |
          set -euo pipefail
          test "$RUNTIME_OS_POLICY_VERSION" = "2.1.0"
          test "$RUNTIME_OS_SOURCE_COMMIT" = "871e416afc55db187d2b6f29c9ff7cac96472223"
          if [ "$EVENT_NAME" = pull_request ]; then
            # Change selection only: the PR head is diffed as inert objects inside
            # the trusted checkout and is never materialized as a worktree. The
            # slice matrix computed here is informational for PR events; the
            # executed matrix comes from the unprivileged candidate workflow.
            export RUNTIME_OS_CANDIDATE_ROOT="$GITHUB_WORKSPACE/.runtime-os-trusted"
            if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] \
              || ! git -C .runtime-os-trusted cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
              || ! git -C .runtime-os-trusted cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              echo "::error::base or head commit unavailable; refusing ambiguous change selection"
              exit 2
            fi
            git -C .runtime-os-trusted diff --no-ext-diff --no-textconv --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            # The candidate run executes its workflow definition from the PR
            # merge ref; it is only base-defined while the PR's own commits
            # (merge-base diff) leave it alone.
            git -C .runtime-os-trusted diff --no-ext-diff --no-textconv --name-only "${BASE_SHA}...${HEAD_SHA}" > pr-own-changes.txt
            if grep -qxF .github/workflows/ci-runtime-os-candidate.yml pr-own-changes.txt; then
              echo "candidate_definition_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "candidate_definition_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            export RUNTIME_OS_CANDIDATE_ROOT="$GITHUB_WORKSPACE/candidate"
            git -C candidate ls-files > changed-files.txt
          fi
          python3 -c 'import json; print(json.dumps(open("changed-files.txt", encoding="utf-8").read().splitlines()))' > changed-files.json
          printf '%s' "$PR_BODY" > pr-body.md
          python3 .runtime-os-trusted/scripts/ci/runtime_os_adapter.py \
            --changed-files-json "$(cat changed-files.json)" \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --body-file pr-body.md \
            --additions "$PR_ADDITIONS" \
            --pr-number "$PR_NUMBER" \
            --repo "$REPOSITORY"

  environment:
    name: Build immutable ci-fast environment once
    needs: preflight
    if: >-
      !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) &&
      (needs.preflight.outputs.has_tests == 'true' || needs.preflight.outputs.run_e2e == 'true')
    runs-on: [self-hosted, Linux, x64, neoengine-shared-linux, qwen-ops]
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.head_sha || github.sha }}

      - name: Install pinned uv once
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: false

      - name: Install pinned ripgrep once
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 1 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          mkdir -p ci-fast/bin
          install -m 0755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" ci-fast/bin/rg

      - name: Build locked environment with one infra-only retry
        run: |
          set -euo pipefail
          attempt=1
          while true; do
            set +e
            uv sync --locked --python 3.11 --extra all --extra dev 2>uv-sync.err
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 1 ] &&
               grep -Eiq '(timed out|connection reset|temporary failure|502|503|504)' uv-sync.err; then
              attempt=2
              continue
            fi
            cat uv-sync.err >&2
            exit "$status"
          done
          mkdir -p ci-fast
          test "$(sha256sum uv.lock | cut -d' ' -f1)" != ""
          tar -czf ci-fast/hermes-ci-fast-environment.tar.gz .venv ci-fast/bin

      - name: Publish immutable run-scoped environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-ci-fast-${{ needs.preflight.outputs.environment_digest }}
          path: ci-fast/hermes-ci-fast-environment.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    name: Runtime OS slice ${{ matrix.index }}/6
    needs: [preflight, environment]
    if: ${{ !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) && needs.preflight.outputs.has_tests == 'true' }}
    runs-on: [self-hosted, Linux, x64, neoengine-shared-linux, qwen-ops]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.head_sha || github.sha }}

      - name: Download immutable ci-fast environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermes-ci-fast-${{ needs.preflight.outputs.environment_digest }}
          path: ci-fast

      - name: Restore immutable environment
        run: |
          tar -xzf ci-fast/hermes-ci-fast-environment.tar.gz
          echo "$GITHUB_WORKSPACE/ci-fast/bin" >> "$GITHUB_PATH"

      - name: Run selected files with interpreter isolation
        env:
          SELECTED_FILES: ${{ matrix.files }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          # The restored environment must leave the checkout clean (same query
          # as the receipt validator), checked before this job imports any test
          # code. /usr/bin/git, not PATH: ci-fast/bin is prepended to PATH.
          # (The environment build already ran the candidate's build backend,
          # and .gitignore is candidate content; see docs.)
          dirty="$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf 'DIRTY_CHECKOUT after environment restore:\n%s\n' "$dirty" >&2
            exit 1
          fi
          source .venv/bin/activate
          python -c 'import os, subprocess, sys; raise SystemExit(subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q", *os.environ["SELECTED_FILES"].split(":")]).returncode)'
          # Same per-file runner and environment contract as tests.yml's
          # required slices (prebuilt .venv with all+dev extras). run_tests.sh
          # is the Stage-0 bootstrap-proof wrapper: it rebuilds an
          # unfingerprinted .venv from uv.lock without dev extras.
          IFS=: read -r -a selected <<< "$SELECTED_FILES"
          # Hermetic locale/hash settings the V1 wrapper also pinned.
          env TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONHASHSEED=0 \
            python scripts/run_tests_parallel.py -j 4 "${selected[@]}"

      - name: Upload protected-main duration sample
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-os-duration-${{ matrix.index }}-${{ github.run_id }}
          path: test_durations.json
          if-no-files-found: error
          retention-days: 1

  duration-telemetry:
    name: Publish protected-main duration telemetry
    needs: [preflight, test]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success'
    runs-on: [self-hosted, Linux, x64, neoengine-shared-linux, qwen-ops]
    timeout-minutes: 5
    steps:
      - name: Download exact-run duration samples
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-os-duration-*-${{ github.run_id }}
          path: durations
      - name: Merge duration samples deterministically
        run: |
          python3 - <<'PY'
          import glob
          import json
          merged = {}
          for path in sorted(glob.glob("durations/**/test_durations.json", recursive=True)):
              with open(path, encoding="utf-8") as handle:
                  merged.update(json.load(handle))
          if not merged:
              raise SystemExit("no protected-main duration samples were produced")
          with open("test_durations.json", "w", encoding="utf-8") as handle:
              json.dump(merged, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Save manifest-and-dependency-bound telemetry
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: ${{ needs.preflight.outputs.duration_cache_key }}-${{ github.sha }}

  e2e:
    name: Runtime OS e2e
    needs: [preflight, environment]
    if: ${{ !contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) && needs.preflight.outputs.run_e2e == 'true' }}
    runs-on: [self-hosted, Linux, x64, neoengine-shared-linux, qwen-ops]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
      - name: Download immutable ci-fast environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermes-ci-fast-${{ needs.preflight.outputs.environment_digest }}
          path: ci-fast
      - name: Restore immutable environment
        run: |
          tar -xzf ci-fast/hermes-ci-fast-environment.tar.gz
          echo "$GITHUB_WORKSPACE/ci-fast/bin" >> "$GITHUB_PATH"
      - name: Run full e2e proof
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short

  candidate-proof:
    name: Await unprivileged candidate proof
    needs: preflight
    if: contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name)
    # GitHub-hosted so it never holds a self-hosted runner. It still holds one
    # hosted job slot while it polls; many concurrent PRs can therefore queue
    # behind each other's waiters on the hosted concurrency limit.
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      actions: read
    steps:
      - name: Bind exact-head candidate workflow conclusion
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          DEFINITION_CHANGED: ${{ needs.preflight.outputs.candidate_definition_changed }}
          CANDIDATE_WORKFLOW: ci-runtime-os-candidate.yml
          DISCOVERY_MINUTES: "20"
          WAIT_MINUTES: "150"
        with:
          retries: 3
          script: |
            if (process.env.DEFINITION_CHANGED !== 'false') {
              core.setFailed(
                'This PR changes ci-runtime-os-candidate.yml, so its candidate proof would be ' +
                  'self-defined; the advisory proof stays red until the definition lands on base',
              );
              return;
            }
            const head = process.env.EXPECTED_HEAD;
            const prNumber = Number(process.env.EXPECTED_PR);
            const expectedTitle = `Runtime OS candidate ${head} on ${process.env.EXPECTED_BASE}`;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const started = Date.now();
            const discoveryDeadline = started + Number(process.env.DISCOVERY_MINUTES) * 60 * 1000;
            const deadline = started + Number(process.env.WAIT_MINUTES) * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            // Back off from 30s to 5min between polls; a rate-limited or
            // transient API failure waits and retries instead of failing.
            let delay = 30 * 1000;
            while (true) {
              let runs;
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: process.env.CANDIDATE_WORKFLOW,
                  event: 'pull_request',
                  head_sha: head,
                  per_page: 100,
                });
              } catch (error) {
                // Only rate limits, server errors, and network failures are
                // transient; any other client error fails fast.
                const status = Number(error.status || 0);
                if (status >= 400 && status < 500 && status !== 403 && status !== 429) {
                  core.setFailed(`Candidate proof lookup failed with HTTP ${status}: ${error.message}`);
                  return;
                }
                if (Date.now() > deadline) {
                  core.setFailed(`Candidate proof lookup kept failing: ${error.message}`);
                  return;
                }
                core.info(`Candidate proof lookup failed (${error.status || error.message}); retrying`);
                await sleep(delay);
                delay = Math.min(delay * 2, 5 * 60 * 1000);
                continue;
              }
              const bound = runs.filter(
                (run) =>
                  run.head_sha === head &&
                  run.display_title === expectedTitle &&
                  run.event === 'pull_request' &&
                  run.head_repository &&
                  run.head_repository.full_name === repository &&
                  // Exactly this PR: a run shared with another PR could carry
                  // that PR's (possibly modified) candidate definition.
                  (run.pull_requests || []).length === 1 &&
                  run.pull_requests[0].number === prNumber,
              );
              const latest = bound.sort((a, b) => b.id - a.id)[0];
              const now = Date.now();
              // A superseded run is cancelled before its replacement is listed.
              const settling =
                latest && latest.conclusion === 'cancelled' && now <= discoveryDeadline;
              if (latest && latest.status === 'completed' && !settling) {
                if (latest.conclusion === 'success') {
                  core.info(`Candidate proof ${latest.html_url} attempt ${latest.run_attempt} succeeded for ${head}`);
                  return;
                }
                core.setFailed(
                  `Candidate proof ${latest.html_url} concluded ${latest.conclusion} for ${head}; ` +
                    're-run it, then re-run this workflow',
                );
                return;
              }
              if (!latest && now > discoveryDeadline) {
                core.setFailed(
                  `No candidate proof run bound to PR #${prNumber} at ${head} on base ` +
                    `${process.env.EXPECTED_BASE}. Likely causes: the base advanced or was ` +
                    'retargeted since the last push, the head is shared with another open PR, ' +
                    'or the PR predates the candidate workflow. Push, update the branch, or reopen.',
                );
                return;
              }
              if (now > deadline) {
                core.setFailed(`Candidate proof for ${head} did not complete in time`);
                return;
              }
              await sleep(delay);
              delay = Math.min(delay * 2, 5 * 60 * 1000);
            }

  hermes-required:
    name: Hermes CI required
    if: always()
    needs: [preflight, environment, test, e2e, candidate-proof]
    # GitHub-hosted: always() runs even for fork PRs (preflight skipped),
    # so this must never land on the shared self-hosted pool; it still
    # fails closed because preflight did not succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate immutable policy proof
        env:
          PULL_REQUEST_EVENT: ${{ contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) }}
          PREFLIGHT: ${{ needs.preflight.result }}
          ENVIRONMENT: ${{ needs.environment.result }}
          TESTS: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          CANDIDATE: ${{ needs.candidate-proof.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          if [ "$PULL_REQUEST_EVENT" = true ]; then
            test "$CANDIDATE" = success
            test "$ENVIRONMENT" = skipped
            test "$TESTS" = skipped
            test "$E2E" = skipped
          else
            test "$CANDIDATE" = skipped
            test "$ENVIRONMENT" = success -o "$ENVIRONMENT" = skipped
            test "$TESTS" = success -o "$TESTS" = skipped
            test "$E2E" = success -o "$E2E" = skipped
          fi

  review-evidence:
    name: Review evidence required
    if: always()
    needs: [preflight, hermes-required]
    # GitHub-hosted: always() runs even for fork PRs (preflight skipped),
    # so this must never land on the shared self-hosted pool; it still
    # fails closed because preflight did not succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discard workspace residue before trusted checkout
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Checkout trusted review validator
        # Only after preflight admitted this event: preflight is skipped for
        # forks and non-default bases, so base.sha is never checked out there.
        if: needs.preflight.result == 'success'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: trusted
      - name: Collect authenticated exact-head GitHub reviews
        if: contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RECEIPT_TTL_HOURS: "24"
        with:
          script: |
            const fs = require('fs');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
              per_page: 100,
            });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
              per_page: 100,
            });
            const builders = new Set([process.env.PR_AUTHOR]);
            for (const commit of commits) {
              if (commit.author && commit.author.login) builders.add(commit.author.login);
              if (commit.committer && commit.committer.login) builders.add(commit.committer.login);
            }
            const latestByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user && review.user.login;
              if (
                login &&
                review.commit_id === process.env.EXPECTED_HEAD &&
                (!latestByReviewer.has(login) ||
                  latestByReviewer.get(login).id < review.id)
              ) {
                latestByReviewer.set(login, review);
              }
            }
            const now = Date.now();
            const ttlMs = Number(process.env.RECEIPT_TTL_HOURS) * 60 * 60 * 1000;
            const accepted = [];
            for (const review of latestByReviewer.values()) {
              const login = review.user && review.user.login;
              const submitted = Date.parse(review.submitted_at || '');
              const evidence =
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/pull/${process.env.EXPECTED_PR}#pullrequestreview-${review.id}`;
              const body = String(review.body || '');
              const identity = body.match(/^- reviewer_identity:\s*(.+)$/mi);
              const evidenceField = body.match(/^- evidence_url_or_path:\s*(.+)$/mi);
              const receiptHeadings = body.match(/^## Review Receipt\b/gmi) || [];
              if (
                review.commit_id !== process.env.EXPECTED_HEAD ||
                !login ||
                builders.has(login) ||
                !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(review.author_association) ||
                !['APPROVED', 'COMMENTED'].includes(review.state) ||
                !Number.isFinite(submitted) ||
                now - submitted < 0 ||
                now - submitted > ttlMs ||
                !identity ||
                identity[1].trim() !== login ||
                !evidenceField ||
                evidenceField[1].trim() !== evidence ||
                receiptHeadings.length !== 1 ||
                !/^- review_type:\s*adversarial$/mi.test(body) ||
                !new RegExp(`^- pr_reviewed:\\s*${process.env.EXPECTED_PR}$`, 'mi').test(body) ||
                !new RegExp(`^- head_sha_reviewed:\\s*${process.env.EXPECTED_HEAD}$`, 'mi').test(body) ||
                !/^- verdict:\s*(PASS|PASS_WITH_CAVEATS)$/mi.test(body) ||
                !/^- unresolved_blockers:\s*(none|n\/a)$/mi.test(body)
              ) {
                continue;
              }
              accepted.push(
                `${body}\n` +
                `- github_review_id: ${review.id}\n` +
                `- github_review_commit_id: ${review.commit_id}\n` +
                `- github_reviewer_login: ${login}\n` +
                `- github_review_submitted_at: ${review.submitted_at}\n`,
              );
            }
            fs.writeFileSync(
              'authenticated-reviews.md',
              accepted.join('\n'),
              { encoding: 'utf8', mode: 0o600 },
            );
            core.info(`Collected ${accepted.length} exact-head authenticated review receipt(s)`);
      - name: Validate every merge-group constituent review
        if: github.event_name == 'merge_group'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.setFailed(
              'Merge-group review/admission is fail-closed until protected authority supplies complete constituent membership and per-member risk classification',
            );
      - name: Validate head-bound canonical receipt
        env:
          RISK: ${{ needs.preflight.outputs.risk_class }}
          HERMES_RESULT: ${{ needs.hermes-required.result }}
          REVIEW_CLASSIFICATION: ${{ needs.preflight.outputs.review_classification }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name) && 'pull_request' || github.event_name }}
        run: |
          set -euo pipefail
          test "$HERMES_RESULT" = success
          if [ "$EVENT_NAME" != pull_request ]; then
            exit 0
          fi
          case "$RISK" in
            R0|R1|R2) exit 0 ;;
            R3) ;;
            R4|R5)
              echo "::error::protected specialist review transport is not authenticated"
              exit 1
              ;;
            *) exit 1 ;;
          esac
          printf '%s' "$REVIEW_CLASSIFICATION" > review-classification.json
          python3 trusted/scripts/review_receipt_validator.py \
            --classification review-classification.json \
            --pr-body authenticated-reviews.md \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --primary-provider codex \
            --output-dir review-evidence \
            --enforce

  merge-admission:
    name: Merge admission
    if: always()
    needs: [hermes-required, review-evidence]
    # GitHub-hosted: always() runs even for fork PRs (preflight skipped),
    # so this must never land on the shared self-hosted pool; it still
    # fails closed because preflight did not succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live exact-head admission state
        if: contains(fromJSON('["pull_request_target","pull_request_review"]'), github.event_name)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
            });
            const { data: base } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: pull.base.ref,
            });
            const labels = new Set(
              (pull.labels || []).map((label) => String(label.name).toLowerCase()),
            );
            const optOut = [
              'hold',
              'do-not-merge',
              'manual-merge',
              'manual-merge-required',
              'no-auto-merge',
              'incident-quarantine',
              'blocked',
            ];
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
              per_page: 100,
            });
            const latest = new Map();
            for (const review of reviews) {
              const login = review.user && review.user.login;
              if (
                login &&
                review.commit_id === process.env.EXPECTED_HEAD &&
                (!latest.has(login) || latest.get(login).id < review.id)
              ) {
                latest.set(login, review);
              }
            }
            const changesRequested =
              [...latest.values()].some((review) => review.state === 'CHANGES_REQUESTED');
            const threadData = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){
                repository(owner:$owner,name:$repo){
                  pullRequest(number:$number){
                    reviewDecision
                    reviewThreads(first:100){
                      pageInfo{hasNextPage}
                      nodes{isResolved}
                    }
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: Number(process.env.EXPECTED_PR),
              },
            );
            const reviewState = threadData.repository.pullRequest;
            const threads = reviewState.reviewThreads;
            if (
              pull.head.sha !== process.env.EXPECTED_HEAD ||
              pull.base.sha !== process.env.EXPECTED_BASE ||
              base.commit.sha !== process.env.EXPECTED_BASE ||
              pull.draft ||
              pull.mergeable !== true ||
              optOut.some((label) => labels.has(label)) ||
              changesRequested ||
              reviewState.reviewDecision === 'CHANGES_REQUESTED' ||
              threads.pageInfo.hasNextPage ||
              threads.nodes.some((thread) => !thread.isResolved)
            ) {
              core.setFailed(
                'Live admission state is stale, conflicted, draft, held, or not bound to current base',
              );
            }
      - name: Evaluate advisory admission without mutation
        env:
          HERMES_RESULT: ${{ needs.hermes-required.result }}
          REVIEW_RESULT: ${{ needs.review-evidence.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          test "$HERMES_RESULT" = success
          test "$REVIEW_RESULT" = success
          test "$IS_DRAFT" != true
          if printf '%s' "$LABELS" | grep -Eiq '"(hold|do-not-merge|manual-merge|manual-merge-required|no-auto-merge|incident-quarantine|blocked)"'; then
            echo "Merge admission denied by an exact-head opt-out label." >&2
            exit 1
          fi
          echo "Advisory only: this workflow does not merge, label, review, or alter branch protection."
