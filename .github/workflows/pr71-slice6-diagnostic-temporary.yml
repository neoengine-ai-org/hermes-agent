name: PR 71 Slice 6 Diagnostic (temporary)

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr71-slice6-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture slice 6 failure
    if: github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Capture exact slice 6 output
        id: slice
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set +e
          source .venv/bin/activate
          python scripts/run_tests_parallel.py --slice 6/6 > slice6.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -n 200 slice6.log || true

      - name: Capture focused classifier output
        id: focused
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set +e
          source .venv/bin/activate
          python -m pytest \
            tests/test_ci_risk_classifier.py \
            tests/test_trusted_ci_risk_classifier.py \
            tests/test_ci_risk_classifier_generic_runtime.py \
            -vv --tb=long > focused-classifier.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -n 200 focused-classifier.log || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr71-slice6-diagnostic
          path: |
            slice6.log
            focused-classifier.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failing status
        if: always()
        env:
          SLICE_STATUS: ${{ steps.slice.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
        run: |
          set -euo pipefail
          if [ "${SLICE_STATUS:-1}" -ne 0 ] || [ "${FOCUSED_STATUS:-1}" -ne 0 ]; then
            exit 1
          fi
