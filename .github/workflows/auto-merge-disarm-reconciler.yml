name: auto-merge-disarm-reconciler

# Disarm-only reconciler. This workflow NEVER enables auto-merge and NEVER
# merges. Org invariant: no PR may gain or retain native GitHub auto-merge
# without an explicit, live, PR-specific, exact-head merge grant. hermes-agent
# has no grant model yet, so every armed PR is disarmed.
#
# Every run is repository-complete: whatever the trigger, it lists ALL armed
# open PRs (GraphQL cursor pagination; an incomplete page fails the run), re-reads
# each live, and disarms it. The triggering PR number (event or dispatch input)
# is only processed first. Any surviving run therefore converges the whole repo.
#
# Convergence: up to 3 list-and-disarm passes, then a final list that must be
# empty; the run exits 0 only then, otherwise it emits ::error:: naming the PRs
# still armed. Irreducible residual: arming after the run's final list is caught
# by the auto_merge_enabled event run and the 15-minute sweep.
#
# Merge DETECTION is best-effort, separate from disarming: after the armed
# passes, every run audits every MERGED PR whose mergedAt is within the last 2
# hours (merged PRs paginated by updatedAt DESC until a node older than the
# window is seen; the full window walk repeats until a walk finds no PR updated
# since the previous one) and raises an ::error:: (nonzero, no comment, no mutation) for
# any whose latest auto-merge event at or before the merge was an enable, i.e.
# it merged via native auto-merge. A PR that merged via native auto-merge more
# than 2 hours before any run executes is NOT alarmed. The alarm names the PR's
# mergeCommit oid (falling back to headRefOid).
#
# Fail closed (invariant d): any API response that cannot prove the state it is
# read for (missing/mistyped pageInfo, node fields, autoMergeRequest, mergedAt,
# updatedAt, timeline items, or a truncated timeline), and any PR that reads as
# not OPEN while still armed, throws and fails the run; it is never treated as
# clean.
#
# Evidence rule: GitHub's own AutoMergeDisabledEvent in the PR timeline (actor
# and time) is the authoritative durable record of a disarm. The PR comment is a
# best-effort human-readable notice, posted once after a successful disarm plus
# read-back. It is deduped only against the newest 30 comments, by exact login
# when /user is known; when /user is unavailable it is simply posted. A POST
# failure fails the run and nothing retries it later.
#
# Drift alarm (detection only): if a PR taken from the armed listing is already
# MERGED on its live re-read, the run emits an ::error:: and exits nonzero
# ("native auto-merge merged before disarm"). A triggering PR (event or dispatch
# input) that is MERGED but did not come from the armed listing is skipped; the
# recent-merge audit decides whether it merged via native auto-merge.
# Closed-but-unmerged PRs are skipped silently.
#
# Security: pull_request_target runs with base-repo privileges. This workflow
# has no checkout step and never executes PR-head code; untrusted strings are
# never interpolated into scripts (only numeric/ENV values are passed via env).

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - edited
      - auto_merge_enabled
      - converted_to_draft
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to reconcile (blank sweeps all open PRs)
        required: false
        type: string

# One repository-wide group with cancel-in-progress: false, so a running disarm
# is never cancelled. GitHub keeps at most one pending run per group and may
# replace an older pending run with a newer one. That is safe because every run
# is repository-complete (it disarms every armed open PR, not just the one that
# triggered it, and a malformed trigger still performs the full sweep), so the
# surviving run covers whatever the replaced run would have. That argument
# covers DISARMING only. Detecting a PR that merged before any run got to it is
# best-effort: the recent-merge audit detects it on any run while the PR's merge
# is within the 2h window; older merges are not alarmed. actionlint rejects `queue: max`, so it is not used.
concurrency:
  group: hermes-auto-merge-disarm
  cancel-in-progress: false

# contents: write is required by the GraphQL disablePullRequestAutoMerge
# mutation when the github.token fallback is used. The job has no checkout
# step and runs no PR-controlled code, so the broader scope is not reachable.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  disarm-auto-merge:
    name: disarm-auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_MERGE_STEWARD_APP: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID != '' && secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY != '' }}
    steps:
      - name: Create merge steward app token
        id: merge-steward-token
        if: env.HAS_MERGE_STEWARD_APP == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID }}
          private-key: ${{ secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Disarm native GitHub auto-merge
        env:
          GH_TOKEN: ${{ steps.merge-steward-token.outputs.token || secrets.NEOENGINE_AUTOMERGE_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ steps.merge-steward-token.outputs.token != '' && 'neo-merge-steward-app' || secrets.NEOENGINE_AUTOMERGE_TOKEN != '' && 'NEOENGINE_AUTOMERGE_TOKEN' || 'github.token' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const token = process.env.GH_TOKEN;
          const tokenSource = process.env.TOKEN_SOURCE || 'github.token';
          const repository = process.env.REPOSITORY;
          const eventName = process.env.EVENT_NAME;
          const manualPrNumber = (process.env.PR_NUMBER || '').trim();
          const apiBase = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/+$/, '');
          const graphqlUrl = process.env.GITHUB_GRAPHQL_URL || `${apiBase}/graphql`;
          const MARKER_PREFIX = 'hermes-auto-merge-disarm:head=';
          const PAGE_SIZE = 100;
          const MAX_PAGES = 200;

          if (!token || !repository || !eventName) {
            throw new Error('missing GH_TOKEN, REPOSITORY, or EVENT_NAME');
          }
          const [owner, repoName] = repository.split('/');

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'User-Agent': 'neoengine-auto-merge-disarm-reconciler',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function rest(method, path, payload) {
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers: payload ? { ...headers, 'Content-Type': 'application/json' } : headers,
              body: payload ? JSON.stringify(payload) : undefined,
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub REST ${method} ${path} ${response.status}: ${text.slice(0, 500)}`);
            return text ? JSON.parse(text) : null;
          }

          async function graphql(query, variables) {
            const response = await fetch(graphqlUrl, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`GitHub GraphQL ${response.status}: non-JSON ${text.slice(0, 300)}`); }
            if (!response.ok || body.errors?.length || !body.data) {
              throw new Error(`GitHub GraphQL ${response.status}: ${JSON.stringify(body.errors ?? body).slice(0, 1000)}`);
            }
            return body.data;
          }

          let ownLogin = null;
          async function resolveIdentity() {
            try {
              ownLogin = (await rest('GET', '/user'))?.login || null;
            } catch {
              ownLogin = null; // app installation tokens cannot read /user; dedupe is skipped
            }
          }

          const PR_FIELDS = `id number state headRefOid
            autoMergeRequest { enabledAt }
            comments(last: 30) { nodes { body author { login } } }`;

          const ARMED_LIST = `query ArmedList($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: ${PAGE_SIZE}, after: $cursor, orderBy: { field: CREATED_AT, direction: ASC }) {
                pageInfo { hasNextPage endCursor }
                nodes { id number autoMergeRequest { enabledAt } }
              }
            }
          }`;
          const PR_BY_NUMBER = `query PrByNumber($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $number) { ${PR_FIELDS} } }
          }`;
          const DISARM = `mutation Disarm($id: ID!) {
            disablePullRequestAutoMerge(input: { pullRequestId: $id }) { pullRequest { number } }
          }`;

          const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
          const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
          // autoMergeRequest must be an OWN property that is null (unarmed) or an
          // object (armed). Absent or mistyped means the state is unproven.
          const armedState = (node, what) => {
            if (!hasOwn(node, 'autoMergeRequest')) throw new Error(`${what}: autoMergeRequest absent (indeterminate)`);
            const v = node.autoMergeRequest;
            if (v === null) return false;
            if (isObject(v)) return true;
            throw new Error(`${what}: autoMergeRequest is neither null nor an object (indeterminate)`);
          };
          const parseTime = (v, what) => {
            const t = typeof v === 'string' ? Date.parse(v) : NaN;
            if (!Number.isFinite(t)) throw new Error(`${what}: not a parseable timestamp (indeterminate)`);
            return t;
          };
          // pageInfo must carry a boolean hasNextPage, and an endCursor when it is true.
          const nextCursor = (pageInfo, what) => {
            if (!isObject(pageInfo) || typeof pageInfo.hasNextPage !== 'boolean') {
              throw new Error(`${what}: pageInfo.hasNextPage is not a boolean (incomplete listing)`);
            }
            if (!pageInfo.hasNextPage) return null;
            if (typeof pageInfo.endCursor !== 'string' || !pageInfo.endCursor) {
              throw new Error(`${what}: hasNextPage without endCursor (incomplete listing)`);
            }
            return pageInfo.endCursor;
          };

          // Cursor pagination over open PRs. Any incomplete or malformed page throws (fails the run).
          async function listArmed() {
            const armed = [];
            let cursor = null;
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const data = await graphql(ARMED_LIST, { owner, name: repoName, cursor });
              const conn = data.repository?.pullRequests;
              if (!isObject(conn) || !Array.isArray(conn.nodes)) throw new Error('incomplete pullRequests page');
              for (const node of conn.nodes) {
                if (!isObject(node) || !Number.isInteger(node.number) || typeof node.id !== 'string') {
                  throw new Error('open PR listing: malformed node (indeterminate)');
                }
                if (armedState(node, `open PR listing #${node.number}`)) armed.push(node);
              }
              cursor = nextCursor(conn.pageInfo, 'open PR listing');
              if (cursor === null) return armed;
            }
            throw new Error(`open PR listing incomplete: exceeded ${MAX_PAGES} pages`);
          }

          const PR_STATES = new Set(['OPEN', 'CLOSED', 'MERGED']);
          // Live read-back. A response that cannot prove state/armed/head throws.
          async function fetchPr(number) {
            const data = await graphql(PR_BY_NUMBER, { owner, name: repoName, number });
            const pr = data.repository?.pullRequest;
            if (!pr) throw new Error(`PR #${number} not found`);
            if (!isObject(pr) || pr.number !== number || typeof pr.id !== 'string') {
              throw new Error(`PR #${number}: malformed read-back (indeterminate)`);
            }
            if (typeof pr.state !== 'string' || !PR_STATES.has(pr.state)) {
              throw new Error(`PR #${number}: read-back state unproven (indeterminate)`);
            }
            if (typeof pr.headRefOid !== 'string' || !pr.headRefOid) {
              throw new Error(`PR #${number}: read-back headRefOid unproven (indeterminate)`);
            }
            armedState(pr, `PR #${number} read-back`);
            return pr;
          }

          // Best-effort notice. Dedupe only against the newest 30 comments and only
          // when our exact login is known; otherwise just post (a duplicate is harmless).
          async function postReceipt(pr) {
            const marker = `<!-- ${MARKER_PREFIX}${pr.headRefOid} -->`;
            if (ownLogin && (pr.comments?.nodes || []).some((c) => c?.author?.login === ownLogin && typeof c.body === 'string' && c.body.includes(marker))) {
              return 'exists';
            }
            const body = [
              marker,
              `Native GitHub auto-merge was disarmed on this PR at head \`${pr.headRefOid}\`.`,
              '',
              'Reason: hermes-agent has no merge-grant model. No PR may gain or retain native auto-merge without an explicit, live, PR-specific, exact-head merge grant.',
              '',
              'Re-arming requires an exact-head founder merge decision for this head SHA. This workflow only disarms; it never arms or merges. The authoritative record of the disarm is GitHub\'s auto-merge-disabled timeline event; this comment is a best-effort notice.',
            ].join('\n');
            await rest('POST', `/repos/${repository}/issues/${pr.number}/comments`, { body });
            return 'posted';
          }

          // candidate: { number, fromArmedList }. The merged-before-disarm drift
          // alarm is raised only for a PR the armed listing reported as armed; a
          // merged triggering PR is left to the recent-merge audit.
          async function disarm(candidate) {
            const live = await fetchPr(candidate.number); // live re-read before acting
            if (live.state === 'MERGED') {
              if (!candidate.fromArmedList) return 'skip';
              console.log(`::error::PR #${live.number} head ${live.headRefOid}: native auto-merge merged before disarm`);
              throw new Error(`PR #${live.number}: merged before disarm (drift alarm)`);
            }
            if (live.autoMergeRequest === null) return 'skip';
            if (live.state !== 'OPEN') {
              // Not open yet still armed (e.g. closed after the armed listing saw it):
              // it cannot be proven disarmed and later listings would not show it.
              throw new Error(`PR #${live.number}: ${live.state} but still armed (indeterminate)`);
            }
            await graphql(DISARM, { id: live.id });
            const after = await fetchPr(live.number);
            if (after.state === 'MERGED') {
              // Auto-merge completed between the live read and the disable.
              console.log(`::error::PR #${after.number} head ${after.headRefOid}: native auto-merge merged before disarm`);
              throw new Error(`PR #${after.number}: merged before disarm (drift alarm)`);
            }
            if (after.autoMergeRequest !== null) throw new Error(`PR #${live.number}: auto-merge still armed after disarm`);
            const receipt = await postReceipt(after);
            console.log(`ok: disarmed auto-merge for PR #${live.number} at ${after.headRefOid}; receipt ${receipt}; token source: ${tokenSource}`);
            return 'disarmed';
          }

          function triggeringNumber() {
            if (eventName === 'pull_request_target') {
              const eventPath = process.env.GITHUB_EVENT_PATH;
              if (!eventPath) throw new Error('missing GITHUB_EVENT_PATH');
              const number = JSON.parse(fs.readFileSync(eventPath, 'utf8')).pull_request?.number;
              if (!Number.isInteger(number)) throw new Error('pull_request_target event without pull_request.number');
              return number;
            }
            if (eventName === 'workflow_dispatch' && manualPrNumber) {
              if (!/^\d+$/.test(manualPrNumber)) throw new Error('workflow_dispatch pr_number must be numeric');
              return Number(manualPrNumber);
            }
            if (eventName === 'schedule' || eventName === 'workflow_dispatch') return null;
            throw new Error(`unsupported event ${eventName}`);
          }

          // Merge-commit auto-merge records AutoMergeEnabledEvent; SQUASH records
          // AutoSquashEnabledEvent and REBASE records AutoRebaseEnabledEvent.
          const ENABLE_TYPES = new Set(['AutoMergeEnabledEvent', 'AutoSquashEnabledEvent', 'AutoRebaseEnabledEvent']);
          const TIMELINE_TYPES = new Set([...ENABLE_TYPES, 'AutoMergeDisabledEvent', 'MergedEvent']);
          const AUDIT_WINDOW_MS = 2 * 60 * 60 * 1000;
          const AUDIT_PAGE_SIZE = 50;
          const RECENT_MERGED = `query RecentMerged($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: MERGED, first: ${AUDIT_PAGE_SIZE}, after: $cursor, orderBy: { field: UPDATED_AT, direction: DESC }) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number mergedAt updatedAt headRefOid mergeCommit { oid }
                  timelineItems(itemTypes: [AUTO_MERGE_ENABLED_EVENT, AUTO_SQUASH_ENABLED_EVENT, AUTO_REBASE_ENABLED_EVENT, AUTO_MERGE_DISABLED_EVENT, MERGED_EVENT], last: 100) {
                    pageInfo { hasPreviousPage }
                    nodes { __typename ... on AutoMergeEnabledEvent { createdAt } ... on AutoSquashEnabledEvent { createdAt } ... on AutoRebaseEnabledEvent { createdAt } ... on AutoMergeDisabledEvent { createdAt } ... on MergedEvent { createdAt } }
                  }
                }
              }
            }
          }`;

          // Decide from a validated timeline whether the PR merged via native
          // auto-merge. Ordering is fail-closed:
          //  - the merge time is the EARLIEST of mergedAt and any MergedEvent
          //    createdAt: event-object creation can lag the merge, and a later
          //    bound would let a post-merge disable hide the enable;
          //  - enable events count when createdAt <= merge time;
          //  - AutoMergeDisabledEvent counts only when createdAt < merge time: a
          //    system disable recorded at merge completion must not hide the enable;
          //  - on equal timestamps a disable sorts BEFORE an enable, so a tie
          //    resolves to "enabled" (alarm).
          function mergedViaAutoMerge(pr, mergedAtMs) {
            const tl = pr.timelineItems;
            if (!isObject(tl) || !Array.isArray(tl.nodes)) throw new Error(`PR #${pr.number}: timelineItems missing (indeterminate)`);
            if (!isObject(tl.pageInfo) || tl.pageInfo.hasPreviousPage !== false) {
              throw new Error(`PR #${pr.number}: auto-merge timeline incomplete (hasPreviousPage is not false)`);
            }
            const items = tl.nodes.map((i) => {
              if (!isObject(i) || typeof i.__typename !== 'string' || !TIMELINE_TYPES.has(i.__typename)) {
                throw new Error(`PR #${pr.number}: malformed timeline item (indeterminate)`);
              }
              return { type: i.__typename, t: parseTime(i.createdAt, `PR #${pr.number} ${i.__typename}.createdAt`) };
            });
            const mergeEvents = items.filter((i) => i.type === 'MergedEvent').map((i) => i.t);
            const mergeTime = Math.min(mergedAtMs, ...mergeEvents);
            const relevant = items
              .filter((i) => (ENABLE_TYPES.has(i.type) && i.t <= mergeTime) || (i.type === 'AutoMergeDisabledEvent' && i.t < mergeTime))
              .sort((x, y) => (x.t - y.t) || ((x.type === 'AutoMergeDisabledEvent' ? 0 : 1) - (y.type === 'AutoMergeDisabledEvent' ? 0 : 1)));
            const last = relevant[relevant.length - 1];
            return Boolean(last && ENABLE_TYPES.has(last.type));
          }

          // Detection only: no comment, no mutation.
          //
          // Completeness argument. Merged PRs are listed ordered by updatedAt DESC.
          // A PR merged inside the window has updatedAt >= mergedAt >= cutoff, so a
          // walk from the top that continues until a page contains a node with
          // updatedAt < cutoff (or hasNextPage is false) sees every in-window PR
          // whose position did not change during the walk. A PR updated DURING a
          // walk moves to the top, possibly ahead of the cursor. The audit therefore
          // repeats the FULL window walk, validating and evaluating every returned
          // in-window PR on every walk, until a walk finds no new (PR, updatedAt)
          // pair; it throws (indeterminate) after MAX_AUDIT_RESCANS walks that keep
          // finding new pairs, after MAX_PAGES pages in one walk, on an updatedAt
          // ordering violation inside a walk, or when updatedAt precedes mergedAt.
          // The decision is taken on the final stable walk: evidence the API first
          // returns after that walk (e.g. a PR that becomes visible late) belongs to
          // the next run, which re-audits everything still inside the window.
          const MAX_AUDIT_RESCANS = 5;
          async function walkMerged(floor, visit) {
            let cursor = null;
            let previousUpdated = Infinity;
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const data = await graphql(RECENT_MERGED, { owner, name: repoName, cursor });
              const conn = data.repository?.pullRequests;
              if (!isObject(conn) || !Array.isArray(conn.nodes)) throw new Error('recent-merge audit: incomplete response');
              let reachedFloor = false;
              for (const pr of conn.nodes) {
                if (!isObject(pr) || !Number.isInteger(pr.number)) throw new Error('recent-merge audit: malformed node (indeterminate)');
                const updatedAt = parseTime(pr.updatedAt, `PR #${pr.number} updatedAt`);
                const mergedAt = parseTime(pr.mergedAt, `PR #${pr.number} mergedAt`);
                if (updatedAt > previousUpdated) throw new Error('recent-merge audit: updatedAt ordering violated (indeterminate)');
                if (updatedAt < mergedAt) throw new Error(`recent-merge audit: PR #${pr.number} updatedAt precedes mergedAt (indeterminate)`);
                previousUpdated = updatedAt;
                if (updatedAt < floor) { reachedFloor = true; continue; }
                visit(pr, updatedAt, mergedAt);
              }
              cursor = nextCursor(conn.pageInfo, 'recent-merge audit');
              if (reachedFloor || cursor === null) return;
            }
            throw new Error(`recent-merge audit incomplete: exceeded ${MAX_PAGES} pages`);
          }

          async function auditRecentMerges(failures) {
            const cutoff = Date.now() - AUDIT_WINDOW_MS;
            const audited = new Map(); // PR number -> updatedAt (ms) already audited
            const flagged = new Set();
            let fresh = 0;
            // Every returned in-window node is validated and evaluated on every
            // walk; the (PR, updatedAt) pair only measures stability and the
            // flagged set only prevents a duplicate alarm. An unchanged updatedAt
            // never skips the evidence a later response carries.
            const visit = (pr, updatedAt, mergedAt) => {
              if (audited.get(pr.number) !== updatedAt) {
                audited.set(pr.number, updatedAt);
                fresh += 1;
              }
              if (mergedAt < cutoff) return;
              if (mergedViaAutoMerge(pr, mergedAt) && !flagged.has(pr.number)) {
                flagged.add(pr.number);
                const sha = pr.mergeCommit?.oid || pr.headRefOid;
                console.log(`::error::PR #${pr.number} merged via native auto-merge at ${sha}; hermes grants no merge authority`);
                failures.push(`PR #${pr.number}: merged via native auto-merge (drift alarm)`);
              }
            };
            await walkMerged(cutoff, visit);
            for (let rescan = 1; rescan <= MAX_AUDIT_RESCANS; rescan += 1) {
              fresh = 0;
              await walkMerged(cutoff, visit);
              if (fresh === 0) return;
            }
            throw new Error(`recent-merge audit indeterminate: merged PRs kept changing across ${MAX_AUDIT_RESCANS} rescans`);
          }

          const MAX_PASSES = 3;

          async function main() {
            const failures = [];
            // Trigger parsing is defensive: a bad input is recorded and the run
            // still performs the full repository sweep, then exits nonzero.
            let first = null;
            try {
              first = triggeringNumber();
            } catch (error) {
              failures.push(`trigger: ${error.message}`);
              console.error(`error: ${error.message}`);
            }
            await resolveIdentity();
            const attempt = async (number, fromArmedList) => {
              try {
                await disarm({ number, fromArmedList });
              } catch (error) {
                failures.push(`PR #${number}: ${error.message}`);
                console.error(`error: ${error.message}`);
              }
            };
            if (first !== null) await attempt(first, false);

            try {
              // Up to MAX_PASSES list-and-disarm passes, then a final list that must
              // be empty. A listing failure is fatal (fail closed).
              let remaining = null;
              for (let pass = 1; pass <= MAX_PASSES; pass += 1) {
                const armed = await listArmed();
                if (!armed.length) { remaining = []; break; }
                console.log(`pass ${pass}: ${armed.length} armed PR(s)`);
                for (const pr of armed) await attempt(pr.number, true);
              }
              if (remaining === null) remaining = await listArmed();
              if (remaining.length) {
                const names = remaining.map((p) => `#${p.number}`).join(', ');
                console.log(`::error::auto-merge still armed after ${MAX_PASSES} passes: ${names}`);
                failures.push(`still armed after ${MAX_PASSES} passes: ${names}`);
              }
            } catch (error) {
              failures.push(`sweep: ${error.message}`);
              console.error(`error: ${error.message}`);
            }
            try {
              await auditRecentMerges(failures);
            } catch (error) {
              failures.push(`recent-merge audit: ${error.message}`);
              console.error(`error: ${error.message}`);
            }
            if (failures.length) throw new Error(`${failures.length} failure(s):\n${failures.join('\n')}`);
            console.log('ok: repository-complete; final armed-list is empty; recent-merge audit clean');
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
