name: auto-merge-disarm-reconciler

# Disarm-only reconciler. This workflow NEVER enables auto-merge and NEVER
# merges. Org invariant: no PR may gain or retain native GitHub auto-merge
# without an explicit, live, PR-specific, exact-head merge grant. hermes-agent
# has no grant model yet, so every armed PR is disarmed.
#
# Every run is repository-complete: whatever the trigger, it lists ALL armed
# open PRs (GraphQL cursor pagination; an incomplete page fails the run), re-reads
# each live, and disarms it. The triggering PR number (event or dispatch input)
# is only processed first. Any surviving run therefore converges the whole repo.
#
# Convergence: up to 3 list-and-disarm passes, then a final list that must be
# empty; the run exits 0 only then, otherwise it emits ::error:: naming the PRs
# still armed. Irreducible residual: arming after the run's final list is caught
# by the auto_merge_enabled event run and the 15-minute sweep.
#
# Merge DETECTION is best-effort, separate from disarming: after the armed
# passes, every run audits the 50 most recently updated MERGED PRs whose
# mergedAt is within the last 2 hours and raises an ::error:: (nonzero, no
# comment, no mutation) for any whose latest auto-merge event before the merge
# was an enable, i.e. it merged via native auto-merge. A PR that merged via
# native auto-merge more than 2 hours before any run executes is NOT alarmed.
#
# Evidence rule: GitHub's own AutoMergeDisabledEvent in the PR timeline (actor
# and time) is the authoritative durable record of a disarm. The PR comment is a
# best-effort human-readable notice, posted once after a successful disarm plus
# read-back. It is deduped only against the newest 30 comments, by exact login
# when /user is known; when /user is unavailable it is simply posted. A POST
# failure fails the run and nothing retries it later.
#
# Drift alarm (detection only): if an armed PR's live re-read is already MERGED,
# the run emits an ::error:: and exits nonzero ("native auto-merge merged before
# disarm"). Closed-but-unmerged PRs are skipped silently.
#
# Security: pull_request_target runs with base-repo privileges. This workflow
# has no checkout step and never executes PR-head code; untrusted strings are
# never interpolated into scripts (only numeric/ENV values are passed via env).

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - edited
      - auto_merge_enabled
      - converted_to_draft
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to reconcile (blank sweeps all open PRs)
        required: false
        type: string

# One repository-wide group with cancel-in-progress: false, so a running disarm
# is never cancelled. GitHub keeps at most one pending run per group and may
# replace an older pending run with a newer one. That is safe because every run
# is repository-complete (it disarms every armed open PR, not just the one that
# triggered it, and a malformed trigger still performs the full sweep), so the
# surviving run covers whatever the replaced run would have. That argument
# covers DISARMING only. Detecting a PR that merged before any run got to it is
# best-effort: the recent-merge audit (2h window, 50 PRs) catches it on any run;
# older merges are not alarmed. actionlint rejects `queue: max`, so it is not used.
concurrency:
  group: hermes-auto-merge-disarm
  cancel-in-progress: false

# contents: write is required by the GraphQL disablePullRequestAutoMerge
# mutation when the github.token fallback is used. The job has no checkout
# step and runs no PR-controlled code, so the broader scope is not reachable.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  disarm-auto-merge:
    name: disarm-auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_MERGE_STEWARD_APP: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID != '' && secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY != '' }}
    steps:
      - name: Create merge steward app token
        id: merge-steward-token
        if: env.HAS_MERGE_STEWARD_APP == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID }}
          private-key: ${{ secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Disarm native GitHub auto-merge
        env:
          GH_TOKEN: ${{ steps.merge-steward-token.outputs.token || secrets.NEOENGINE_AUTOMERGE_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ steps.merge-steward-token.outputs.token != '' && 'neo-merge-steward-app' || secrets.NEOENGINE_AUTOMERGE_TOKEN != '' && 'NEOENGINE_AUTOMERGE_TOKEN' || 'github.token' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const token = process.env.GH_TOKEN;
          const tokenSource = process.env.TOKEN_SOURCE || 'github.token';
          const repository = process.env.REPOSITORY;
          const eventName = process.env.EVENT_NAME;
          const manualPrNumber = (process.env.PR_NUMBER || '').trim();
          const apiBase = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/+$/, '');
          const graphqlUrl = process.env.GITHUB_GRAPHQL_URL || `${apiBase}/graphql`;
          const MARKER_PREFIX = 'hermes-auto-merge-disarm:head=';
          const PAGE_SIZE = 100;
          const MAX_PAGES = 200;

          if (!token || !repository || !eventName) {
            throw new Error('missing GH_TOKEN, REPOSITORY, or EVENT_NAME');
          }
          const [owner, repoName] = repository.split('/');

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'User-Agent': 'neoengine-auto-merge-disarm-reconciler',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function rest(method, path, payload) {
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers: payload ? { ...headers, 'Content-Type': 'application/json' } : headers,
              body: payload ? JSON.stringify(payload) : undefined,
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub REST ${method} ${path} ${response.status}: ${text.slice(0, 500)}`);
            return text ? JSON.parse(text) : null;
          }

          async function graphql(query, variables) {
            const response = await fetch(graphqlUrl, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`GitHub GraphQL ${response.status}: non-JSON ${text.slice(0, 300)}`); }
            if (!response.ok || body.errors?.length || !body.data) {
              throw new Error(`GitHub GraphQL ${response.status}: ${JSON.stringify(body.errors ?? body).slice(0, 1000)}`);
            }
            return body.data;
          }

          let ownLogin = null;
          async function resolveIdentity() {
            try {
              ownLogin = (await rest('GET', '/user'))?.login || null;
            } catch {
              ownLogin = null; // app installation tokens cannot read /user; dedupe is skipped
            }
          }

          const PR_FIELDS = `id number state headRefOid
            autoMergeRequest { enabledAt }
            comments(last: 30) { nodes { body author { login } } }`;

          const ARMED_LIST = `query ArmedList($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: ${PAGE_SIZE}, after: $cursor, orderBy: { field: CREATED_AT, direction: ASC }) {
                pageInfo { hasNextPage endCursor }
                nodes { id number autoMergeRequest { enabledAt } }
              }
            }
          }`;
          const PR_BY_NUMBER = `query PrByNumber($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $number) { ${PR_FIELDS} } }
          }`;
          const DISARM = `mutation Disarm($id: ID!) {
            disablePullRequestAutoMerge(input: { pullRequestId: $id }) { pullRequest { number } }
          }`;

          // Cursor pagination over open PRs. Any incomplete page throws (fails the run).
          async function listArmed() {
            const armed = [];
            let cursor = null;
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const data = await graphql(ARMED_LIST, { owner, name: repoName, cursor });
              const conn = data.repository?.pullRequests;
              if (!conn || !Array.isArray(conn.nodes) || !conn.pageInfo) throw new Error('incomplete pullRequests page');
              armed.push(...conn.nodes.filter((p) => p.autoMergeRequest));
              if (!conn.pageInfo.hasNextPage) return armed;
              if (!conn.pageInfo.endCursor) throw new Error('hasNextPage without endCursor: incomplete listing');
              cursor = conn.pageInfo.endCursor;
            }
            throw new Error(`open PR listing incomplete: exceeded ${MAX_PAGES} pages`);
          }

          async function fetchPr(number) {
            const data = await graphql(PR_BY_NUMBER, { owner, name: repoName, number });
            const pr = data.repository?.pullRequest;
            if (!pr) throw new Error(`PR #${number} not found`);
            return pr;
          }

          // Best-effort notice. Dedupe only against the newest 30 comments and only
          // when our exact login is known; otherwise just post (a duplicate is harmless).
          async function postReceipt(pr) {
            const marker = `<!-- ${MARKER_PREFIX}${pr.headRefOid} -->`;
            if (ownLogin && (pr.comments?.nodes || []).some((c) => c?.author?.login === ownLogin && typeof c.body === 'string' && c.body.includes(marker))) {
              return 'exists';
            }
            const body = [
              marker,
              `Native GitHub auto-merge was disarmed on this PR at head \`${pr.headRefOid}\`.`,
              '',
              'Reason: hermes-agent has no merge-grant model. No PR may gain or retain native auto-merge without an explicit, live, PR-specific, exact-head merge grant.',
              '',
              'Re-arming requires an exact-head founder merge decision for this head SHA. This workflow only disarms; it never arms or merges. The authoritative record of the disarm is GitHub\'s auto-merge-disabled timeline event; this comment is a best-effort notice.',
            ].join('\n');
            await rest('POST', `/repos/${repository}/issues/${pr.number}/comments`, { body });
            return 'posted';
          }

          async function disarm(candidate) {
            const live = await fetchPr(candidate.number); // live re-read before acting
            if (live.state === 'MERGED') {
              console.log(`::error::PR #${live.number} head ${live.headRefOid}: native auto-merge merged before disarm`);
              throw new Error(`PR #${live.number}: merged before disarm (drift alarm)`);
            }
            if (live.state !== 'OPEN' || !live.autoMergeRequest) return 'skip';
            await graphql(DISARM, { id: live.id });
            const after = await fetchPr(live.number);
            if (after.autoMergeRequest) throw new Error(`PR #${live.number}: auto-merge still armed after disarm`);
            const receipt = await postReceipt(after);
            console.log(`ok: disarmed auto-merge for PR #${live.number} at ${after.headRefOid}; receipt ${receipt}; token source: ${tokenSource}`);
            return 'disarmed';
          }

          function triggeringNumber() {
            if (eventName === 'pull_request_target') {
              const eventPath = process.env.GITHUB_EVENT_PATH;
              if (!eventPath) throw new Error('missing GITHUB_EVENT_PATH');
              const number = JSON.parse(fs.readFileSync(eventPath, 'utf8')).pull_request?.number;
              if (!Number.isInteger(number)) throw new Error('pull_request_target event without pull_request.number');
              return number;
            }
            if (eventName === 'workflow_dispatch' && manualPrNumber) {
              if (!/^\d+$/.test(manualPrNumber)) throw new Error('workflow_dispatch pr_number must be numeric');
              return Number(manualPrNumber);
            }
            if (eventName === 'schedule' || eventName === 'workflow_dispatch') return null;
            throw new Error(`unsupported event ${eventName}`);
          }

          const AUDIT_WINDOW_MS = 2 * 60 * 60 * 1000;
          const RECENT_MERGED = `query RecentMerged($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: MERGED, first: 50, orderBy: { field: UPDATED_AT, direction: DESC }) {
                nodes {
                  number mergedAt headRefOid mergeCommit { oid }
                  timelineItems(itemTypes: [AUTO_MERGE_ENABLED_EVENT, AUTO_MERGE_DISABLED_EVENT, MERGED_EVENT], last: 20) {
                    nodes { __typename ... on AutoMergeEnabledEvent { createdAt } ... on AutoMergeDisabledEvent { createdAt } ... on MergedEvent { createdAt } }
                  }
                }
              }
            }
          }`;

          // Detection only: no comment, no mutation. One list query carries the
          // timeline reads (at most 50 PRs x 20 items).
          async function auditRecentMerges(failures) {
            const data = await graphql(RECENT_MERGED, { owner, name: repoName });
            const nodes = data.repository?.pullRequests?.nodes;
            if (!Array.isArray(nodes)) throw new Error('recent-merge audit: incomplete response');
            const cutoff = Date.now() - AUDIT_WINDOW_MS;
            for (const pr of nodes) {
              if (!pr.mergedAt || Date.parse(pr.mergedAt) < cutoff) continue;
              const items = pr.timelineItems?.nodes || [];
              const mergedAt = items.filter((i) => i.__typename === 'MergedEvent').map((i) => i.createdAt).sort().pop();
              const before = items
                .filter((i) => (i.__typename === 'AutoMergeEnabledEvent' || i.__typename === 'AutoMergeDisabledEvent') && (!mergedAt || i.createdAt <= mergedAt))
                .sort((x, y) => (x.createdAt < y.createdAt ? -1 : x.createdAt > y.createdAt ? 1 : 0));
              const last = before[before.length - 1];
              if (last && last.__typename === 'AutoMergeEnabledEvent') {
                const sha = pr.mergeCommit?.oid || pr.headRefOid;
                console.log(`::error::PR #${pr.number} merged via native auto-merge at ${sha}; hermes grants no merge authority`);
                failures.push(`PR #${pr.number}: merged via native auto-merge (drift alarm)`);
              }
            }
          }

          const MAX_PASSES = 3;

          async function main() {
            const failures = [];
            // Trigger parsing is defensive: a bad input is recorded and the run
            // still performs the full repository sweep, then exits nonzero.
            let first = null;
            try {
              first = triggeringNumber();
            } catch (error) {
              failures.push(`trigger: ${error.message}`);
              console.error(`error: ${error.message}`);
            }
            await resolveIdentity();
            const attempt = async (number) => {
              try {
                await disarm({ number });
              } catch (error) {
                failures.push(`PR #${number}: ${error.message}`);
                console.error(`error: ${error.message}`);
              }
            };
            if (first !== null) await attempt(first);

            try {
              // Up to MAX_PASSES list-and-disarm passes, then a final list that must
              // be empty. A listing failure is fatal (fail closed).
              let remaining = null;
              for (let pass = 1; pass <= MAX_PASSES; pass += 1) {
                const armed = await listArmed();
                if (!armed.length) { remaining = []; break; }
                console.log(`pass ${pass}: ${armed.length} armed PR(s)`);
                for (const pr of armed) await attempt(pr.number);
              }
              if (remaining === null) remaining = await listArmed();
              if (remaining.length) {
                const names = remaining.map((p) => `#${p.number}`).join(', ');
                console.log(`::error::auto-merge still armed after ${MAX_PASSES} passes: ${names}`);
                failures.push(`still armed after ${MAX_PASSES} passes: ${names}`);
              }
            } catch (error) {
              failures.push(`sweep: ${error.message}`);
              console.error(`error: ${error.message}`);
            }
            try {
              await auditRecentMerges(failures);
            } catch (error) {
              failures.push(`recent-merge audit: ${error.message}`);
              console.error(`error: ${error.message}`);
            }
            if (failures.length) throw new Error(`${failures.length} failure(s):\n${failures.join('\n')}`);
            console.log('ok: repository-complete; final armed-list is empty; recent-merge audit clean');
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
