name: auto-merge-disarm-reconciler

# Disarm-only reconciler. This workflow NEVER enables auto-merge and NEVER
# merges. Org invariant: no PR may gain or retain native GitHub auto-merge
# without an explicit, live, PR-specific, exact-head merge grant. hermes-agent
# has no grant model yet, so every armed PR is disarmed.
#
# Security: pull_request_target runs with base-repo privileges. This workflow
# has no checkout step and never executes PR-head code; untrusted strings are
# never interpolated into scripts (only numeric/ENV values are passed via env).

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - edited
      - auto_merge_enabled
      - converted_to_draft
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to reconcile (blank sweeps all open PRs)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  disarm-auto-merge:
    name: disarm-auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_MERGE_STEWARD_APP: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID != '' && secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY != '' }}
    steps:
      - name: Create merge steward app token
        id: merge-steward-token
        if: env.HAS_MERGE_STEWARD_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID }}
          private-key: ${{ secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Disarm native GitHub auto-merge
        env:
          GH_TOKEN: ${{ steps.merge-steward-token.outputs.token || secrets.NEOENGINE_AUTOMERGE_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ steps.merge-steward-token.outputs.token != '' && 'neo-merge-steward-app' || secrets.NEOENGINE_AUTOMERGE_TOKEN != '' && 'NEOENGINE_AUTOMERGE_TOKEN' || 'github.token' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const token = process.env.GH_TOKEN;
          const tokenSource = process.env.TOKEN_SOURCE || 'github.token';
          const repository = process.env.REPOSITORY;
          const eventName = process.env.EVENT_NAME;
          const eventPath = process.env.GITHUB_EVENT_PATH;
          const manualPrNumber = (process.env.PR_NUMBER || '').trim();
          const apiBase = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/+$/, '');
          const graphqlUrl = process.env.GITHUB_GRAPHQL_URL || `${apiBase}/graphql`;
          const MARKER_PREFIX = 'hermes-auto-merge-disarm:head=';
          const PAGE_SIZE = 100;
          const MAX_PAGES = 200;

          if (!token || !repository || !eventName) {
            throw new Error('missing GH_TOKEN, REPOSITORY, or EVENT_NAME');
          }

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'User-Agent': 'neoengine-auto-merge-disarm-reconciler',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function rest(method, path, payload) {
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers: payload ? { ...headers, 'Content-Type': 'application/json' } : headers,
              body: payload ? JSON.stringify(payload) : undefined,
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub REST ${method} ${path} ${response.status}: ${text.slice(0, 500)}`);
            return text ? JSON.parse(text) : null;
          }

          async function graphql(query, variables) {
            const response = await fetch(graphqlUrl, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`GitHub GraphQL ${response.status}: non-JSON ${text.slice(0, 300)}`); }
            if (!response.ok || body.errors?.length || !body.data) {
              throw new Error(`GitHub GraphQL ${response.status}: ${JSON.stringify(body.errors ?? body).slice(0, 1000)}`);
            }
            return body.data;
          }

          // Complete pagination or throw: an incomplete listing must fail the run.
          async function paginate(basePath) {
            const items = [];
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const sep = basePath.includes('?') ? '&' : '?';
              const batch = await rest('GET', `${basePath}${sep}per_page=${PAGE_SIZE}&page=${page}`);
              if (!Array.isArray(batch)) throw new Error(`unexpected non-array listing for ${basePath}`);
              items.push(...batch);
              if (batch.length < PAGE_SIZE) return items;
            }
            throw new Error(`pagination incomplete for ${basePath}: exceeded ${MAX_PAGES} pages`);
          }

          async function tokenLogin() {
            try {
              const me = await rest('GET', '/user');
              return me?.login || null;
            } catch {
              return null; // app installation tokens cannot read /user
            }
          }

          function isOwnReceipt(comment, marker, login) {
            if (typeof comment.body !== 'string' || !comment.body.includes(marker)) return false;
            if (comment.user?.type !== 'Bot') return false;
            if (login && comment.user?.login !== login) return false;
            return true;
          }

          async function postReceipt(pr, headSha, login) {
            const marker = `<!-- ${MARKER_PREFIX}${headSha} -->`;
            const comments = await paginate(`/repos/${repository}/issues/${pr.number}/comments`);
            if (comments.some((c) => isOwnReceipt(c, marker, login))) return 'exists';
            const body = [
              marker,
              `Native GitHub auto-merge was disarmed on this PR at head \`${headSha}\`.`,
              '',
              'Reason: hermes-agent has no merge-grant model. No PR may gain or retain native auto-merge without an explicit, live, PR-specific, exact-head merge grant.',
              '',
              'Re-arming requires an exact-head founder merge decision for this head SHA. This workflow only disarms; it never arms or merges.',
            ].join('\n');
            await rest('POST', `/repos/${repository}/issues/${pr.number}/comments`, { body });
            return 'posted';
          }

          const READ_BACK = `query ReadBack($id: ID!) {
            node(id: $id) { ... on PullRequest { number headRefOid autoMergeRequest { enabledAt } } }
          }`;
          const DISARM = `mutation Disarm($id: ID!) {
            disablePullRequestAutoMerge(input: { pullRequestId: $id }) { pullRequest { number } }
          }`;

          async function reconcile(listed, login) {
            // Always re-read live state; event payloads can be stale.
            const pr = await rest('GET', `/repos/${repository}/pulls/${listed.number}`);
            if (pr.state !== 'open') return { number: pr.number, action: 'skip-not-open' };
            if (!pr.auto_merge) return { number: pr.number, action: 'not-armed' };

            await graphql(DISARM, { id: pr.node_id });
            const data = await graphql(READ_BACK, { id: pr.node_id });
            const node = data.node;
            if (!node) throw new Error(`PR #${pr.number}: read-back returned no node`);
            if (node.autoMergeRequest) {
              throw new Error(`PR #${pr.number}: auto-merge still armed after disarm`);
            }
            const headSha = node.headRefOid || pr.head?.sha;
            if (!headSha) throw new Error(`PR #${pr.number}: cannot determine head SHA for receipt`);
            const receipt = await postReceipt(pr, headSha, login);
            console.log(`ok: disarmed auto-merge for PR #${pr.number} at ${headSha}; receipt ${receipt}; token source: ${tokenSource}`);
            return { number: pr.number, action: 'disarmed', receipt };
          }

          async function targets() {
            if (eventName === 'workflow_dispatch' && manualPrNumber) {
              if (!/^\d+$/.test(manualPrNumber)) throw new Error('workflow_dispatch pr_number must be numeric');
              return [{ number: Number(manualPrNumber) }];
            }
            if (eventName === 'pull_request_target') {
              const eventPath = process.env.GITHUB_EVENT_PATH;
              if (!eventPath) throw new Error('missing GITHUB_EVENT_PATH');
              const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
              const number = event.pull_request?.number;
              if (!Number.isInteger(number)) throw new Error('pull_request_target event without pull_request.number');
              return [{ number }];
            }
            if (eventName === 'schedule' || eventName === 'workflow_dispatch') {
              const prs = await paginate(`/repos/${repository}/pulls?state=open`);
              return prs.map((p) => ({ number: p.number }));
            }
            throw new Error(`unsupported event ${eventName}`);
          }

          async function main() {
            const login = await tokenLogin();
            const list = await targets();
            const failures = [];
            for (const target of list) {
              try {
                await reconcile(target, login);
              } catch (error) {
                failures.push(`PR #${target.number}: ${error.message}`);
                console.error(`error: ${error.message}`);
              }
            }
            if (failures.length) throw new Error(`${failures.length} PR(s) failed:\n${failures.join('\n')}`);
            console.log(`ok: reconciled ${list.length} PR(s)`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
