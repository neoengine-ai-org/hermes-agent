name: auto-merge-disarm-reconciler

# Disarm-only reconciler. This workflow NEVER enables auto-merge and NEVER
# merges. Org invariant: no PR may gain or retain native GitHub auto-merge
# without an explicit, live, PR-specific, exact-head merge grant. hermes-agent
# has no grant model yet, so every armed PR is disarmed.
#
# Security: pull_request_target runs with base-repo privileges. This workflow
# has no checkout step and never executes PR-head code; untrusted strings are
# never interpolated into scripts (only numeric/ENV values are passed via env).

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - edited
      - auto_merge_enabled
      - converted_to_draft
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to reconcile (blank sweeps all open PRs)
        required: false
        type: string

# One repository-wide group: event runs and sweeps are serialized, so they can
# never race on the same PR (including the list-then-POST receipt dedupe).
# cancel-in-progress is false so a running disarm is never cancelled. GitHub
# keeps at most one pending run per group and may replace an older pending run
# with a newer one; that is safe because every run re-reads live state (event
# runs re-read the PR, sweeps list all open PRs) and a disarm is idempotent,
# so no disarm is lost. actionlint rejects `queue: max`, so it is not used.
concurrency:
  group: hermes-auto-merge-disarm
  cancel-in-progress: false

# contents: write is required by the GraphQL disablePullRequestAutoMerge
# mutation when the github.token fallback is used. The job has no checkout
# step and runs no PR-controlled code, so the broader scope is not reachable.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  disarm-auto-merge:
    name: disarm-auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_MERGE_STEWARD_APP: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID != '' && secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY != '' }}
    steps:
      - name: Create merge steward app token
        id: merge-steward-token
        if: env.HAS_MERGE_STEWARD_APP == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NEOENGINE_MERGE_STEWARD_APP_ID }}
          private-key: ${{ secrets.NEOENGINE_MERGE_STEWARD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Disarm native GitHub auto-merge
        env:
          GH_TOKEN: ${{ steps.merge-steward-token.outputs.token || secrets.NEOENGINE_AUTOMERGE_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ steps.merge-steward-token.outputs.token != '' && 'neo-merge-steward-app' || secrets.NEOENGINE_AUTOMERGE_TOKEN != '' && 'NEOENGINE_AUTOMERGE_TOKEN' || 'github.token' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const token = process.env.GH_TOKEN;
          const tokenSource = process.env.TOKEN_SOURCE || 'github.token';
          const repository = process.env.REPOSITORY;
          const eventName = process.env.EVENT_NAME;
          const manualPrNumber = (process.env.PR_NUMBER || '').trim();
          const apiBase = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/+$/, '');
          const graphqlUrl = process.env.GITHUB_GRAPHQL_URL || `${apiBase}/graphql`;
          const MARKER_PREFIX = 'hermes-auto-merge-disarm:head=';
          const PAGE_SIZE = 100;
          const MAX_PAGES = 200;

          if (!token || !repository || !eventName) {
            throw new Error('missing GH_TOKEN, REPOSITORY, or EVENT_NAME');
          }
          const [owner, repoName] = repository.split('/');

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'User-Agent': 'neoengine-auto-merge-disarm-reconciler',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function rest(method, path, payload) {
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers: payload ? { ...headers, 'Content-Type': 'application/json' } : headers,
              body: payload ? JSON.stringify(payload) : undefined,
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub REST ${method} ${path} ${response.status}: ${text.slice(0, 500)}`);
            return text ? JSON.parse(text) : null;
          }

          async function graphql(query, variables) {
            const response = await fetch(graphqlUrl, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`GitHub GraphQL ${response.status}: non-JSON ${text.slice(0, 300)}`); }
            if (!response.ok || body.errors?.length || !body.data) {
              throw new Error(`GitHub GraphQL ${response.status}: ${JSON.stringify(body.errors ?? body).slice(0, 1000)}`);
            }
            return body.data;
          }

          // REST page pagination, used only for one PR's comment list. Completes or throws.
          async function paginateRest(basePath) {
            const items = [];
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const batch = await rest('GET', `${basePath}?per_page=${PAGE_SIZE}&page=${page}`);
              if (!Array.isArray(batch)) throw new Error(`unexpected non-array listing for ${basePath}`);
              items.push(...batch);
              if (batch.length < PAGE_SIZE) return items;
            }
            throw new Error(`pagination incomplete for ${basePath}: exceeded ${MAX_PAGES} pages`);
          }

          let ownLogin = null;
          async function resolveIdentity() {
            try {
              ownLogin = (await rest('GET', '/user'))?.login || null;
            } catch {
              ownLogin = null; // app installation tokens cannot read /user
            }
          }

          // Identity: exact login match when /user is known (PAT path, any account
          // type); otherwise fall back to "is a Bot account".
          function isOwn(login, type) {
            if (ownLogin) return login === ownLogin;
            return type === 'Bot';
          }

          const PR_FIELDS = `id number state headRefOid
            autoMergeRequest { enabledAt }
            timelineItems(last: 5, itemTypes: [AUTO_MERGE_DISABLED_EVENT]) {
              nodes { ... on AutoMergeDisabledEvent { createdAt actor { login __typename } } }
            }
            comments(last: 30) { nodes { body createdAt author { login __typename } } }`;

          const SWEEP_LIST = `query SweepList($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: ${PAGE_SIZE}, after: $cursor, orderBy: { field: CREATED_AT, direction: ASC }) {
                pageInfo { hasNextPage endCursor }
                nodes { ${PR_FIELDS} }
              }
            }
          }`;
          const ARMED_LIST = `query ArmedList($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: ${PAGE_SIZE}, after: $cursor, orderBy: { field: CREATED_AT, direction: ASC }) {
                pageInfo { hasNextPage endCursor }
                nodes { id number state headRefOid autoMergeRequest { enabledAt } }
              }
            }
          }`;
          const PR_BY_NUMBER = `query PrByNumber($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $number) { ${PR_FIELDS} } }
          }`;
          const DISARM = `mutation Disarm($id: ID!) {
            disablePullRequestAutoMerge(input: { pullRequestId: $id }) { pullRequest { number } }
          }`;

          // Cursor pagination (snapshot-safe against a changing open-PR set).
          // Any incomplete page throws, which fails the run.
          async function listOpen(query) {
            const out = [];
            let cursor = null;
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const data = await graphql(query, { owner, name: repoName, cursor });
              const conn = data.repository?.pullRequests;
              if (!conn || !Array.isArray(conn.nodes) || !conn.pageInfo) throw new Error('incomplete pullRequests page');
              out.push(...conn.nodes);
              if (!conn.pageInfo.hasNextPage) return out;
              if (!conn.pageInfo.endCursor) throw new Error('hasNextPage without endCursor: incomplete listing');
              cursor = conn.pageInfo.endCursor;
            }
            throw new Error(`open PR listing incomplete: exceeded ${MAX_PAGES} pages`);
          }

          async function fetchPr(number) {
            const data = await graphql(PR_BY_NUMBER, { owner, name: repoName, number });
            const pr = data.repository?.pullRequest;
            if (!pr) throw new Error(`PR #${number} not found`);
            return pr;
          }

          async function ensureReceipt(number, headSha, minCreatedAt, reason) {
            const marker = `<!-- ${MARKER_PREFIX}${headSha} -->`;
            const comments = await paginateRest(`/repos/${repository}/issues/${number}/comments`);
            const own = comments.filter((c) => typeof c.body === 'string' && c.body.includes(`<!-- ${MARKER_PREFIX}`) && isOwn(c.user?.login, c.user?.type));
            if (own.some((c) => c.body.includes(marker))) return 'exists';
            if (minCreatedAt && own.some((c) => (c.created_at || '') >= minCreatedAt)) return 'covered';
            const body = [
              marker,
              `Native GitHub auto-merge was disarmed on this PR; head at receipt time: \`${headSha}\`${reason ? ` (${reason})` : ''}.`,
              '',
              'Reason: hermes-agent has no merge-grant model. No PR may gain or retain native auto-merge without an explicit, live, PR-specific, exact-head merge grant.',
              '',
              'Re-arming requires an exact-head founder merge decision for this head SHA. This workflow only disarms; it never arms or merges.',
            ].join('\n');
            await rest('POST', `/repos/${repository}/issues/${number}/comments`, { body });
            return 'posted';
          }

          // Receipt repair, independent of armed state: if we disarmed (durable
          // auto_merge_disabled timeline event by our identity) and no own receipt
          // was created at or after that event, post it. Bounded: newest 5 disable
          // events and newest 30 comments per PR from the listing; a full comment
          // read happens only when the snapshot shows no covering receipt.
          async function repairReceipt(pr) {
            const events = (pr.timelineItems?.nodes || []).filter((e) => e && e.createdAt && isOwn(e.actor?.login, e.actor?.__typename));
            if (!events.length) return 'no-own-disarm';
            const latest = events.map((e) => e.createdAt).sort().pop();
            const covered = (pr.comments?.nodes || []).some((c) =>
              typeof c.body === 'string' && c.body.includes(`<!-- ${MARKER_PREFIX}`) && c.createdAt >= latest && isOwn(c.author?.login, c.author?.__typename));
            if (covered) return 'covered';
            const result = await ensureReceipt(pr.number, pr.headRefOid, latest, 'repair');
            if (result === 'posted') console.log(`ok: repaired missing receipt for PR #${pr.number}`);
            return result;
          }

          async function reconcile(snapshot, isLive) {
            let pr = snapshot;
            if (pr.autoMergeRequest && !isLive) pr = await fetchPr(pr.number); // live re-read before acting
            if (pr.state !== 'OPEN') return 'skip-not-open';
            if (!pr.autoMergeRequest) return repairReceipt(pr);

            await graphql(DISARM, { id: pr.id });
            const after = await fetchPr(pr.number);
            if (after.autoMergeRequest) throw new Error(`PR #${pr.number}: auto-merge still armed after disarm`);
            const receipt = await ensureReceipt(pr.number, after.headRefOid || pr.headRefOid, null, null);
            console.log(`ok: disarmed auto-merge for PR #${pr.number} at ${after.headRefOid}; receipt ${receipt}; token source: ${tokenSource}`);
            return 'disarmed';
          }

          async function runAll(prs, isLive, failures) {
            for (const pr of prs) {
              try {
                await reconcile(pr, isLive);
              } catch (error) {
                failures.push(`PR #${pr.number}: ${error.message}`);
                console.error(`error: ${error.message}`);
              }
            }
          }

          async function main() {
            await resolveIdentity();
            const failures = [];
            let count = 0;
            if (eventName === 'workflow_dispatch' && manualPrNumber && !/^\d+$/.test(manualPrNumber)) {
              throw new Error('workflow_dispatch pr_number must be numeric');
            }
            if (eventName === 'pull_request_target' || (eventName === 'workflow_dispatch' && manualPrNumber)) {
              let number = Number(manualPrNumber);
              if (eventName === 'pull_request_target') {
                const eventPath = process.env.GITHUB_EVENT_PATH;
                if (!eventPath) throw new Error('missing GITHUB_EVENT_PATH');
                number = JSON.parse(fs.readFileSync(eventPath, 'utf8')).pull_request?.number;
                if (!Number.isInteger(number)) throw new Error('pull_request_target event without pull_request.number');
              }
              await runAll([await fetchPr(number)], true, failures);
              count = 1;
            } else if (eventName === 'schedule' || eventName === 'workflow_dispatch') {
              const first = await listOpen(SWEEP_LIST);
              await runAll(first, false, failures);
              // Second pass: re-list armed state to catch any PR skipped or armed by churn.
              const second = (await listOpen(ARMED_LIST)).filter((p) => p.autoMergeRequest);
              await runAll(second, false, failures);
              count = first.length;
            } else {
              throw new Error(`unsupported event ${eventName}`);
            }
            if (failures.length) throw new Error(`${failures.length} PR(s) failed:\n${failures.join('\n')}`);
            console.log(`ok: reconciled ${count} PR(s)`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
