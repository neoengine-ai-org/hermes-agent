name: CI Runtime OS candidate proof
# The waiter binds to this exact title; it is fixed when the run is triggered.
run-name: Runtime OS candidate ${{ github.event.pull_request.head.sha }} on ${{ github.event.pull_request.base.sha }}

# Unprivileged half of the Runtime OS advisory: the only place PR-head code is
# checked out and executed. It runs in `pull_request` context, never base
# context, so it cannot write base-scoped caches or inherit the privileged
# `pull_request_target` token. As defined here it requests `contents: read`
# and references no secrets, but GitHub loads this file from the PR merge ref:
# a repository writer can edit it, exactly as they can already run any
# workflow from a pushed branch. As defined here it runs on GitHub-hosted
# ephemeral runners rather than the shared, persistent self-hosted host. The privileged ci-runtime-os-advisory.yml
# therefore refuses proof from a PR that modifies this file, and treats the
# result as test evidence only, never policy, review, or admission authority.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: runtime-os-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUNTIME_OS_POLICY_VERSION: "2.1.0"
  RUNTIME_OS_SOURCE_COMMIT: 871e416afc55db187d2b6f29c9ff7cac96472223

jobs:
  plan:
    name: Select candidate proof slices
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      environment_digest: ${{ steps.environment.outputs.environment_digest }}
    steps:
      - name: Checkout base selection policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .runtime-os-base

      - name: Checkout same-repository candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Compute immutable environment and duration identities
        id: environment
        run: |
          set -euo pipefail
          dependency_digest="$(sha256sum candidate/uv.lock | cut -d' ' -f1)"
          test_manifest_digest="$(
            find candidate/tests -type f -name 'test_*.py' -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              cut -d' ' -f1
          )"
          environment_digest="$(printf '%s\n%s\n%s\n' \
            "$RUNTIME_OS_SOURCE_COMMIT" "$dependency_digest" "$test_manifest_digest" |
            sha256sum |
            cut -d' ' -f1)"
          echo "environment_digest=$environment_digest" >> "$GITHUB_OUTPUT"
          echo "duration_cache_key=runtime-os-duration-${test_manifest_digest}-${dependency_digest}" >> "$GITHUB_OUTPUT"

      - name: Read protected-main duration telemetry
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: ${{ steps.environment.outputs.duration_cache_key }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ steps.environment.outputs.duration_cache_key }}-

      - name: Select proof slices
        id: plan
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions || 0 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNTIME_OS_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          RUNTIME_OS_DURATIONS_PATH: ${{ github.workspace }}/test_durations.json
        run: |
          set -euo pipefail
          if ! git -C candidate cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -C candidate fetch --no-tags origin "$BASE_SHA"
          fi
          git -C candidate diff --name-only "$BASE_SHA" HEAD > changed-files.txt
          python3 -c 'import json; print(json.dumps(open("changed-files.txt", encoding="utf-8").read().splitlines()))' > changed-files.json
          printf '%s' "$PR_BODY" > pr-body.md
          python3 .runtime-os-base/scripts/ci/runtime_os_adapter.py \
            --changed-files-json "$(cat changed-files.json)" \
            --event-name pull_request \
            --ref "$EVENT_REF" \
            --body-file pr-body.md \
            --additions "$PR_ADDITIONS" \
            --pr-number "$PR_NUMBER" \
            --repo "$REPOSITORY"

  environment:
    name: Build immutable ci-fast environment once
    needs: plan
    if: >-
      (needs.plan.outputs.has_tests == 'true' || needs.plan.outputs.run_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned uv once
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          enable-cache: false

      - name: Install pinned ripgrep once
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 1 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          mkdir -p ci-fast/bin
          install -m 0755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" ci-fast/bin/rg

      - name: Build locked environment with one infra-only retry
        # Hosted jobs land on fresh VMs: keep uv's managed interpreter inside
        # the artifact (same workspace path on every hosted runner) so the
        # restored .venv never points at a Python only the build VM had.
        env:
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/ci-fast/bin/.python
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          set -euo pipefail
          attempt=1
          while true; do
            set +e
            uv sync --locked --python 3.11 --extra all --extra dev 2>uv-sync.err
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 1 ] &&
               grep -Eiq '(timed out|connection reset|temporary failure|502|503|504)' uv-sync.err; then
              attempt=2
              continue
            fi
            cat uv-sync.err >&2
            exit "$status"
          done
          mkdir -p ci-fast
          test "$(sha256sum uv.lock | cut -d' ' -f1)" != ""
          tar -czf ci-fast/hermes-ci-fast-environment.tar.gz .venv ci-fast/bin

      - name: Publish immutable run-scoped environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-ci-fast-${{ needs.plan.outputs.environment_digest }}
          path: ci-fast/hermes-ci-fast-environment.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    name: Runtime OS slice ${{ matrix.index }}/6
    needs: [plan, environment]
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download immutable ci-fast environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermes-ci-fast-${{ needs.plan.outputs.environment_digest }}
          path: ci-fast

      - name: Restore immutable environment
        run: |
          tar -xzf ci-fast/hermes-ci-fast-environment.tar.gz
          echo "$GITHUB_WORKSPACE/ci-fast/bin" >> "$GITHUB_PATH"

      - name: Run selected files with interpreter isolation
        env:
          SELECTED_FILES: ${{ matrix.files }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          python -c 'import os, subprocess, sys; raise SystemExit(subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q", *os.environ["SELECTED_FILES"].split(":")]).returncode)'
          scripts/run_tests.sh -j 4 --files "$SELECTED_FILES"

  e2e:
    name: Runtime OS e2e
    needs: [plan, environment]
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download immutable ci-fast environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermes-ci-fast-${{ needs.plan.outputs.environment_digest }}
          path: ci-fast
      - name: Restore immutable environment
        run: |
          tar -xzf ci-fast/hermes-ci-fast-environment.tar.gz
          echo "$GITHUB_WORKSPACE/ci-fast/bin" >> "$GITHUB_PATH"
      - name: Run full e2e proof
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest -m integration tests/test_wheel_locales_e2e.py -v
          python -m pytest tests/integration/ -v --tb=short
          python -m pytest tests/e2e/ -v --tb=short
