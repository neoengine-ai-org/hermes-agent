name: PR71 Temporary Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Print PR commit attribution
        shell: bash
        run: |
          set -euo pipefail
          merge_base=$(git merge-base origin/main HEAD)
          git log "${merge_base}..HEAD" --no-merges --format='sha=%H author=%an email=%ae'

  focused-classifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install focused test dependency
        run: python3 -m pip install --disable-pip-version-check -q pytest
      - name: Run classifier regression suites
        run: >-
          python3 -m pytest -q --tb=short
          tests/test_ci_risk_classifier_generic_runtime.py
          tests/test_ci_risk_classifier.py
          tests/test_trusted_ci_risk_classifier.py
