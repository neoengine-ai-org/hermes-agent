name: Contributor Attribution Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Full history needed for git log

      - name: Check for unmapped contributor emails
        run: |
          # Get the merge base between this PR and main
          MERGE_BASE=$(git merge-base origin/main HEAD)

          # Find any new author emails in this PR's commits
          NEW_EMAILS=$(git log ${MERGE_BASE}..HEAD --format='%ae' --no-merges | sort -u)

          if [ -z "$NEW_EMAILS" ]; then
            echo "No new commits to check."
            exit 0
          fi

          # Check each email against AUTHOR_MAP in release.py. Gmail ignores
          # periods in the local part, so accept an exact mapping or the same
          # canonical Gmail mailbox. Other domains remain exact-match only.
          MISSING=""
          while IFS= read -r email; do
            # Skip teknium and bot emails
            case "$email" in
              *teknium*|*noreply@github.com*|*dependabot*|*github-actions*|*anthropic.com*|*cursor.com*)
                continue ;;
            esac

            # GitHub noreply emails auto-resolve.
            if echo "$email" | grep -qP '\+.*@users\.noreply\.github\.com'; then
              continue
            fi

            if ! python3 - "$email" <<'PY'
          import ast
          import sys
          from pathlib import Path

          candidate = sys.argv[1].strip().casefold()
          module = ast.parse(Path("scripts/release.py").read_text(encoding="utf-8"))
          author_map = None
          for node in module.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "AUTHOR_MAP" for target in node.targets):
                  author_map = ast.literal_eval(node.value)
                  break

          if not isinstance(author_map, dict):
              raise SystemExit("AUTHOR_MAP not found or is not a literal dictionary")

          def canonical(value: str) -> str:
              local, separator, domain = value.strip().casefold().partition("@")
              if not separator:
                  return value.strip().casefold()
              if domain in {"gmail.com", "googlemail.com"}:
                  local = local.split("+", 1)[0].replace(".", "")
                  domain = "gmail.com"
              return f"{local}@{domain}"

          exact = {str(key).casefold() for key in author_map}
          canonical_mapped = {canonical(str(key)) for key in author_map}
          raise SystemExit(0 if candidate in exact or canonical(candidate) in canonical_mapped else 1)
          PY
            then
              AUTHOR=$(git log --author="$email" --format='%an' -1)
              MISSING="${MISSING}\n  ${email} (${AUTHOR})"
            fi
          done <<< "$NEW_EMAILS"

          if [ -n "$MISSING" ]; then
            echo ""
            echo "⚠️  New contributor email(s) not in AUTHOR_MAP:"
            echo -e "$MISSING"
            echo ""
            echo "Please add mappings to scripts/release.py AUTHOR_MAP:"
            echo -e "$MISSING" | while read -r line; do
              email=$(echo "$line" | sed 's/^ *//' | cut -d' ' -f1)
              [ -z "$email" ] && continue
              echo "    \"${email}\": \"<github-username>\","
            done
            echo ""
            echo "To find the GitHub username for an email:"
            echo "  gh api 'search/users?q=EMAIL+in:email' --jq '.items[0].login'"
            exit 1
          else
            echo "✅ All contributor emails are mapped in AUTHOR_MAP."
          fi
